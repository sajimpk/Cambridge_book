<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Books List</title>
  <meta name="description" content="View the complete list of available books in the library." />
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <script src="https://pl31489803.profitableratecpmnetwork.com/db/42/d1/db42d1194031e3704ecba29cba3b3e19.js"></script>
</head>
<body class="page-shell" data-theme="light">
  <!-- Top Global Navbar -->
  <header class="site-header">
    <div class="site-header__inner">
      <a href="/" class="site-logo">
        <span class="site-logo__icon" aria-hidden="true">📚</span>
        <span class="site-logo__text">Book Library</span>
      </a>

      <nav class="site-nav" id="siteNav" aria-label="Main Navigation">
        <ul class="site-nav__list">
          <li><a href="/" class="site-nav__link">Home</a></li>
          <li><a href="/list/" class="site-nav__link active">All Books</a></li>
          <li><a href="/api-guide/" class="site-nav__link site-nav__link--highlight">⚡ API Setup Guide</a></li>
          <li><a href="/count/" class="site-nav__link">Stats</a></li>
        </ul>
      </nav>

      <div class="site-header__actions">
        <button type="button" id="themeToggle" class="button button-secondary theme-toggle-btn" aria-label="Toggle visual theme">Dark</button>
        <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open Navigation Menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </header>

  <div class="page-shell__layout">
    <main class="container">
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="../Index.html">Home</a>
        <span aria-hidden="true">/</span>
        <span>List</span>
      </nav>

      <section class="book-card" style="box-shadow: var(--shadow-md);">
        <h2 style="font-size: 1.35rem; font-weight: 800; margin-bottom: 1.5rem; letter-spacing: -0.01em;">All Available Books</h2>
        <ul id="bookListContainer" style="list-style: none; display: flex; flex-direction: column; gap: 0.75rem;">
          <!-- List elements will be populated dynamically -->
        </ul>
      </section>

      <!-- Network Display Zone -->
      <section class="network-display-zone">
        <div class="network-display-wrap">
          <div class="network-slot-primary">
            <script async="async" data-cfasync="false" src="https://pl31489804.profitableratecpmnetwork.com/a9c6c796c17537fc8b9dab0f775eb036/invoke.js"></script>
            <div id="container-a9c6c796c17537fc8b9dab0f775eb036"></div>
          </div>
          <div class="network-slot-secondary">
            <script>
              atOptions = {
                'key' : 'f3fc9bd70740a49b5778d583ba48ac0d',
                'format' : 'iframe',
                'height' : 250,
                'width' : 300,
                'params' : {}
              };
            </script>
            <script src="https://www.highrevenueformat.com/f3fc9bd70740a49b5778d583ba48ac0d/invoke.js"></script>
          </div>
        </div>
      </section>
    </main>
  </div>

  <footer class="site-footer">
    <div class="site-footer__inner"><div><strong>Book Library</strong><span>Comprehensive practice materials</span></div><p>&copy; 2026 Book Library</p></div>
  </footer>

  <script type="module">
    import { registerServiceWorker } from '../assets/js/pwa.js';
    import { initSponsoredAds, isGeoBlocked } from '../assets/js/vendor-core.js';
    import { initSiteLocalization } from '../assets/js/site-language.js';
    import { encodeBookId } from '../assets/js/url-helper.js';

    const listContainer = document.getElementById('bookListContainer');
    const themeToggle = document.getElementById('themeToggle');
    let activeTheme = localStorage.getItem('theme') || 'light';
    let showAds = localStorage.getItem('show-ads') !== 'false';

    function setTheme(theme) {
      document.body.dataset.theme = theme;
      if (themeToggle) themeToggle.textContent = theme === 'dark' ? 'Light' : 'Dark';
      localStorage.setItem('theme', theme);
    }

    function setAdsState(state) {
      showAds = state;
      localStorage.setItem('show-ads', showAds ? 'true' : 'false');
      applyAdSettings();
    }

    function applyAdSettings() {
      const allowed = showAds && !isGeoBlocked();
      const adElements = document.querySelectorAll('.ads-wrapper, .footer-bottom-ad, .legacy-ad, .legacy-sponsored');
      adElements.forEach(el => {
        el.style.display = allowed ? '' : 'none';
      });
    }

    setTheme(activeTheme);
    if (themeToggle) {
      themeToggle.addEventListener('click', () => {
        activeTheme = activeTheme === 'dark' ? 'light' : 'dark';
        setTheme(activeTheme);
      });
    }

    setAdsState(showAds);

    const closeAdsBtn = document.getElementById('closeAdsBtn');
    if (closeAdsBtn) {
      closeAdsBtn.addEventListener('click', () => {
        setAdsState(false);
      });
    }

    window.addEventListener('storage', (event) => {
      if (event.key === 'show-ads') {
        const newState = localStorage.getItem('show-ads') !== 'false';
        setAdsState(newState);
      }
    });

    async function loadList() {
      try {
        const response = await fetch('../data/book.json');
        if (!response.ok) throw new Error('Books data not found');
        const books = await response.json();
        
        listContainer.innerHTML = Object.entries(books).map(([key, book]) => `
          <li style="border: 1px solid var(--border); padding: 0.85rem 1rem; border-radius: 12px; background: var(--surface-strong); display: flex; justify-content: space-between; align-items: center; transition: var(--transition);">
            <div style="display: flex; flex-direction: column; gap: 0.2rem; text-align: left;">
              <span style="font-weight: 800; font-size: 1rem; color: var(--text);">${book.title}</span>
              <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em;">${book.category || 'IELTS'}</span>
            </div>
            <a href="../book/?book=${encodeBookId(key)}" class="button button-primary" style="padding: 0.5rem 1rem; font-size: 0.8rem; border-radius: 8px; font-weight: 700;">Open Book</a>
          </li>
        `).join('');
      } catch (error) {
        console.error(error);
        listContainer.innerHTML = '<li style="color: var(--text-muted);">Failed to load book directory.</li>';
      }
    }

    loadList();
    registerServiceWorker();
    initSponsoredAds();
    initSiteLocalization();
  </script>
  <script src="../assets/js/contact-links.js" defer></script>
  <script src="../assets/js/claim-counter.js" defer></script>
  <script src="../assets/js/navbar.js" defer></script>
</body>
</html>
