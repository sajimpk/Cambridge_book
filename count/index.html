<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Claim Click Report • Arif Academy</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body class="page-shell count-page" data-theme="light">
  <main class="count-dashboard container">
    <header class="count-header">
      <div>
        <p class="count-eyebrow">Arif Academy</p>
        <h1>Claim Click Report</h1>
        <p id="countStatus">Loading daily click totals…</p>
      </div>
      <a class="button button-primary" href="../">Back to books</a>
    </header>

    <section class="count-summary" aria-label="Click summary">
      <article>
        <span>All-time clicks</span>
        <strong id="totalClicks">—</strong>
      </article>
      <article>
        <span>Today</span>
        <strong id="todayClicks">—</strong>
      </article>
    </section>

    <section class="count-table-card">
      <div class="count-table-heading">
        <div>
          <h2>Clicks by day</h2>
          <p>Recent data is protected. Old daily data is auto-cleaned when D1 reaches 100 MiB.</p>
        </div>
        <button class="button count-delete-button" id="deleteOldClicks" type="button">
          Delete data older than 7 days
        </button>
      </div>
      <div class="count-table-wrap">
        <table class="count-table">
          <thead>
            <tr><th>Date</th><th>Clicks</th></tr>
          </thead>
          <tbody id="dailyClicksBody">
            <tr><td colspan="2" class="count-empty">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog class="country-dialog" id="countryDialog">
    <div class="country-dialog__header">
      <div>
        <p>Country breakdown</p>
        <h2 id="countryDialogDate">Selected date</h2>
      </div>
      <button class="country-dialog__close" id="closeCountryDialog" type="button" aria-label="Close">&times;</button>
    </div>
    <div class="country-dialog__body" id="countryDialogBody">
      <p class="count-empty">Loading…</p>
    </div>
    <nav class="country-pagination" id="countryPagination" aria-label="Country result pages" hidden>
      <button type="button" id="previousCountryPage">Previous</button>
      <span id="countryPageStatus">Page 1 of 1</span>
      <button type="button" id="nextCountryPage">Next</button>
    </nav>
  </dialog>

  <script src="../assets/js/count.js" defer></script>
</body>
</html>
